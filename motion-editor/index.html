<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotionLab – Editor de Motion Design</title>
<style>
:root{
  --bg:#0e1015;--panel:#161922;--panel2:#1c202b;--line:#2a2f3c;--text:#e8ebf2;--mute:#8d96a9;
  --accent:#7c5cff;--accent2:#22d3ee;--danger:#ff5d73;--key:#ffc857;--radius:8px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:auto;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none;display:block}
#app{display:grid;height:100vh;min-width:1000px;min-height:640px;
  grid-template-columns:216px minmax(0,1fr) 292px;grid-template-rows:48px minmax(0,1fr) 264px;
  grid-template-areas:"top top top" "left stage insp" "tl tl tl"}
header#top{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;margin-right:8px}
.logo{width:20px;height:20px;border-radius:6px;background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--key),var(--accent))}
.sp{flex:1}
.btn,.ib,select,input[type=number],input[type=text],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;white-space:nowrap}
.btn:hover,.ib:hover{border-color:#44495a;background:#232838}
.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:#8d70ff}
.ib{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0}
.ib.active{background:var(--accent);border-color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
select{padding:5px 6px}
input[type=number],input[type=text]{padding:5px 6px;width:100%;min-width:0}
input[type=color]{width:100%;height:28px;padding:2px;background:var(--panel2);border:1px solid var(--line);border-radius:6px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
textarea{width:100%;resize:vertical;min-height:58px;padding:6px}
aside{background:var(--panel);overflow:auto}
#left{grid-area:left;border-right:1px solid var(--line);padding:12px}
#inspector{grid-area:insp;border-left:1px solid var(--line);padding:12px}
h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute)}
h4{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mute)}
.add-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.add-grid .ib{width:100%;height:36px}
.pset-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.pset-opts label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:12px}
.chip:hover{border-color:var(--accent);color:#fff}
.chip.in{border-left:3px solid var(--accent2)}
.chip.out{border-left:3px solid var(--danger)}
.chip.loop{border-left:3px solid var(--key)}
.chip.text{border-left:3px solid var(--accent)}
.hint{color:var(--mute);font-size:12px;margin:10px 0 0}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px}
/* stage */
#stage{grid-area:stage;display:flex;flex-direction:column;min-width:0;min-height:0;background:#0a0b0f}
#viewport{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#frame{position:relative;box-shadow:0 10px 50px #000a,0 0 0 1px #ffffff14;background:#000}
#frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
#transport{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
#scrub{flex:1;accent-color:var(--accent)}
#timeLbl{font-variant-numeric:tabular-nums;min-width:128px;text-align:right;color:var(--mute)}
#timeLbl b{color:var(--text);font-weight:600}
/* inspector */
.prow{display:grid;grid-template-columns:84px 1fr 26px;gap:6px;align-items:center;margin-bottom:5px}
.prow.nokf{grid-template-columns:84px 1fr}
.plabel{color:var(--mute);cursor:ew-resize;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kfb{width:24px;height:24px;border:1px solid var(--line);background:var(--panel2);border-radius:5px;padding:0;color:var(--mute);font-size:11px}
.kfb.has{color:var(--key);border-color:#6b5a2a}
.kfb.on{background:var(--key);color:#2a2000;border-color:var(--key)}
.btnrow{display:flex;gap:6px;margin-top:6px}
.btnrow .ib{flex:1;width:auto}
.btnrow .danger:hover{border-color:var(--danger);color:var(--danger)}
.kfsec{margin-top:14px;padding:10px;border:1px solid #6b5a2a;border-radius:var(--radius);background:#2a240f55}
.kfsec h4{margin-top:0;color:var(--key)}
label.chk{display:flex;gap:6px;align-items:center;margin:6px 0;color:var(--text)}
/* timeline */
#timeline{grid-area:tl;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);min-height:0}
.tl-head{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);color:var(--mute)}
.tl-head input[type=range]{accent-color:var(--accent);width:140px}
#tlScroll{flex:1;overflow:auto;position:relative;min-height:0}
.tl-inner{position:relative;min-height:100%}
.tl-row{display:flex;height:30px;border-bottom:1px solid #20242f}
.tl-row.sel{background:#7c5cff14}
.tl-row.sub{height:24px;background:#0000002a}
.tl-label{position:sticky;left:0;z-index:5;flex:none;width:190px;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--panel);border-right:1px solid var(--line);overflow:hidden;cursor:pointer}
.tl-row.sel .tl-label{background:#1e1b33}
.tl-row.sub .tl-label{padding-left:30px;color:var(--mute);font-size:12px;background:#12141b}
.tl-label .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-label .mini{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--mute);padding:0;border-radius:4px}
.tl-label .mini:hover{background:#ffffff14;color:var(--text)}
.tl-label .mini.off{opacity:.4}
.tl-track{position:relative;flex:none;cursor:text;background-image:repeating-linear-gradient(90deg,#ffffff0d 0 1px,transparent 1px var(--grid,20px))}
.tl-ruler{height:26px;position:sticky;top:0;z-index:6;background:var(--panel)}
.tl-ruler .tl-label{cursor:default;color:var(--mute);background:var(--panel)}
.tick{position:absolute;top:0;bottom:0;padding:4px 0 0 4px;border-left:1px solid #ffffff30;font-size:10px;color:var(--mute);pointer-events:none;font-variant-numeric:tabular-nums}
.tl-bar{position:absolute;top:5px;bottom:5px;border-radius:6px;cursor:grab;border:1px solid #ffffff40;min-width:6px}
.tl-bar.locked{cursor:not-allowed;filter:grayscale(.6)}
.tl-bar.hidden{opacity:.35}
.bh{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.bh.l{left:0}.bh.r{right:0}
.bh:hover{background:#ffffff55}
.mk{position:absolute;top:50%;width:6px;height:6px;background:#ffffffcc;transform:translate(-50%,-50%) rotate(45deg);pointer-events:none}
.kfd{position:absolute;top:50%;width:11px;height:11px;background:var(--key);transform:translate(-50%,-50%) rotate(45deg);border:1px solid #000a;cursor:grab;z-index:2}
.kfd.sel{background:#fff;outline:2px solid var(--accent)}
#playhead{position:absolute;top:0;bottom:0;width:0;z-index:4;pointer-events:none}
#playhead::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--danger)}
#playhead::after{content:"";position:absolute;left:-6px;top:0;width:12px;height:12px;background:var(--danger);clip-path:polygon(0 0,100% 0,50% 100%)}
/* modal & toast */
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;width:340px;text-align:center}
.pbar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:14px 0}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#222736;border:1px solid var(--line);padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="logo"></span>MotionLab</div>
    <select id="tplSel" title="Modelos">
      <option value="">Modelos…</option>
      <option value="title">Título animado</option>
      <option value="lower">Lower third</option>
      <option value="logo">Logo reveal</option>
      <option value="count">Contagem 3-2-1</option>
      <option value="blank">Projeto em branco</option>
    </select>
    <button class="btn" id="btnGen" title="Gera uma composição animada aleatória"><span data-icon="shuffle"></span>Gerar aleatório</button>
    <span class="sp"></span>
    <button class="ib" id="btnUndo" data-icon="undo" title="Desfazer (Ctrl+Z)"></button>
    <button class="ib" id="btnRedo" data-icon="redo" title="Refazer (Ctrl+Shift+Z)"></button>
    <button class="btn" id="btnOpen" title="Abrir projeto (.json)"><span data-icon="upload"></span>Abrir</button>
    <button class="btn" id="btnSave" title="Salvar projeto (.json)"><span data-icon="download"></span>Salvar</button>
    <button class="btn" id="btnPng" title="Exportar frame atual em PNG"><span data-icon="image"></span>PNG</button>
    <button class="btn primary" id="btnExport" title="Gravar a animação em vídeo"><span data-icon="film"></span>Exportar vídeo</button>
  </header>

  <aside id="left">
    <h3>Adicionar</h3>
    <div class="add-grid">
      <button class="ib" data-add="rect" data-icon="square" title="Retângulo"></button>
      <button class="ib" data-add="ellipse" data-icon="circle" title="Elipse"></button>
      <button class="ib" data-add="triangle" data-icon="triangle" title="Triângulo"></button>
      <button class="ib" data-add="star" data-icon="star" title="Estrela"></button>
      <button class="ib" data-add="text" data-icon="type" title="Texto"></button>
      <button class="ib" data-add="image" data-icon="image" title="Imagem"></button>
    </div>
    <h3 style="margin-top:18px">Animações</h3>
    <div class="pset-opts">
      <label>Duração<input type="number" id="psDur" value="0.6" min="0.1" step="0.1"></label>
      <label>Ancorar em<select id="psAnchor"><option value="layer">Início/fim da camada</option><option value="head">Playhead</option></select></label>
    </div>
    <div id="presets"></div>
    <p class="hint">Selecione uma camada e clique numa animação. Depois ajuste os <b style="color:var(--key)">◆ keyframes</b> na linha do tempo.</p>
    <p class="hint"><kbd>Espaço</kbd> play · <kbd>Del</kbd> excluir · <kbd>Ctrl</kbd>+<kbd>D</kbd> duplicar · <kbd>,</kbd> <kbd>.</kbd> quadro a quadro · <kbd>K</kbd> keyframe</p>
  </aside>

  <main id="stage">
    <div id="viewport"><div id="frame"><canvas id="cv"></canvas><canvas id="ov"></canvas></div></div>
    <div id="transport">
      <button class="ib" id="btnStart" data-icon="skipback" title="Ir ao início (Home)"></button>
      <button class="ib" id="btnPlay" data-icon="play" title="Play/Pause (Espaço)"></button>
      <button class="ib active" id="btnLoop" data-icon="repeat" title="Repetir"></button>
      <input type="range" id="scrub" min="0" max="1" step="any" value="0">
      <span id="timeLbl"></span>
    </div>
  </main>

  <aside id="inspector"></aside>

  <section id="timeline">
    <div class="tl-head">
      <b style="color:var(--text)">Linha do tempo</b>
      <span class="sp"></span>
      <span>Zoom</span><input type="range" id="tlZoom" min="30" max="500" value="120">
      <button class="btn" id="btnFit">Ajustar</button>
    </div>
    <div id="tlScroll"></div>
  </section>
</div>

<div id="modal" hidden><div class="mbox"><b>Gravando vídeo…</b><div class="pbar"><i id="pbarI"></i></div>
  <p class="hint" style="margin:0 0 12px">Mantenha esta aba visível até terminar.</p><button class="btn" id="btnCancelExp">Cancelar</button></div></div>
<div id="toast"></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============================ utilidades ============================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const r2=v=>Math.round(v*100)/100, r3=v=>Math.round(v*1000)/1000;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const ICONS={
 play:'<polygon points="5 3 19 12 5 21 5 3"/>',pause:'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
 skipback:'<polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>',
 repeat:'<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
 undo:'<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',
 redo:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',
 square:'<rect x="3" y="3" width="18" height="18" rx="2"/>',circle:'<circle cx="12" cy="12" r="9"/>',
 triangle:'<path d="M12 3 22 20H2z"/>',star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
 type:'<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>',
 image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
 download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
 upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
 film:'<rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/>',
 shuffle:'<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>',
 trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
 copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
 up:'<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>',
 down:'<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>',
 eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
 eyeoff:'<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>',
 lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
 unlock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>'
};
const icon=(n,s=16)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
function injectIcons(root=document){ $$('[data-icon]',root).forEach(el=>{ el.insertAdjacentHTML('afterbegin',icon(el.dataset.icon)); el.removeAttribute('data-icon'); }); }

/* ============================ easing & cores ============================ */
const EASE={
 linear:t=>t,
 inQuad:t=>t*t, outQuad:t=>t*(2-t), inOutQuad:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
 inCubic:t=>t*t*t, outCubic:t=>1-Math.pow(1-t,3), inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
 inBack:t=>{const c=1.70158;return (c+1)*t*t*t-c*t*t},
 outBack:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
 inOutBack:t=>{const c=1.70158*1.525;return t<.5?(Math.pow(2*t,2)*((c+1)*2*t-c))/2:(Math.pow(2*t-2,2)*((c+1)*(t*2-2)+c)+2)/2},
 outBounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375},
 outElastic:t=>t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1,
 hold:t=>t<1?0:1
};
const EASE_LABEL={linear:'Linear',inQuad:'Ease In',outQuad:'Ease Out',inOutQuad:'Ease In-Out',inCubic:'Cubic In',outCubic:'Cubic Out',inOutCubic:'Cubic In-Out',inBack:'Back In',outBack:'Back Out (overshoot)',inOutBack:'Back In-Out',outBounce:'Bounce',outElastic:'Elastic',hold:'Degrau (hold)'};
function hex2rgb(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h.slice(0,6),16)||0;return[n>>16&255,n>>8&255,n&255]}
const rgb2hex=a=>'#'+a.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
function mixColor(a,b,p){p=clamp(p,0,1);const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((v,i)=>v+(B[i]-v)*p))}
const luma=h=>{const[r,g,b]=hex2rgb(h);return(.299*r+.587*g+.114*b)/255};

/* ============================ modelo de dados ============================ */
const PROPS=[ // propriedades animáveis
 {k:'x',label:'X',step:1},{k:'y',label:'Y',step:1},{k:'w',label:'Largura',step:1,min:0},{k:'h',label:'Altura',step:1,min:0},
 {k:'rot',label:'Rotação °',step:1},{k:'scale',label:'Escala',step:.01,min:0},{k:'opacity',label:'Opacidade',step:.01,min:0,max:1},
 {k:'radius',label:'Raio',step:1,min:0},{k:'fill',label:'Cor',type:'color'},{k:'strokeW',label:'Contorno',step:1,min:0},{k:'reveal',label:'Revelar',step:.01,min:0,max:1}
];
const PMAP=Object.fromEntries(PROPS.map(p=>[p.k,p]));
const ANIM_ORDER=PROPS.map(p=>p.k);
const NAMES={rect:'Retângulo',ellipse:'Elipse',triangle:'Triângulo',star:'Estrela',text:'Texto',image:'Imagem'};
const FONTS=[['system-ui, "Segoe UI", Roboto, sans-serif','Sans (sistema)'],['Impact, "Arial Black", sans-serif','Impact'],['"Arial Black", Arial, sans-serif','Arial Black'],['Georgia, serif','Georgia (serifa)'],['"Trebuchet MS", sans-serif','Trebuchet'],['"Courier New", monospace','Courier (mono)'],['Verdana, sans-serif','Verdana']];
const SIZES=[[1280,720,'16:9 HD (1280×720)'],[1920,1080,'16:9 Full HD (1920×1080)'],[1080,1920,'9:16 Stories/Reels (1080×1920)'],[1080,1080,'1:1 Quadrado (1080×1080)'],[1080,1350,'4:5 Feed (1080×1350)']];

let project, assets={}, time=0, playing=false, loopOn=true, selId=null, selKF=null, exporting=false, cancelExport=false;
let pxPerSec=120, viewScale=1, rafId=0, lastTs=0;
const LABELW=190;

const newProject=(w=1280,h=720)=>({w,h,duration:5,fps:30,bg:'#0e1015',layers:[]});
const sel=()=>project.layers.find(l=>l.id===selId)||null;
const eps=()=>.5/project.fps;
const visibleAt=(L,t)=>L.visible&&t>=L.start-1e-6&&t<=L.end+1e-6;

function makeLayer(type,over={}){
  const L={id:uid(),name:'',type,start:0,end:project.duration,visible:true,locked:false,noFill:false,
    props:{x:project.w/2,y:project.h/2,w:300,h:300,rot:0,scale:1,opacity:1,radius:0,fill:'#7c5cff',stroke:'#ffffff',strokeW:0,reveal:1},tracks:{}};
  if(type==='text'){Object.assign(L,{text:'Seu texto',font:FONTS[0][0],size:96,weight:800});L.props.fill='#ffffff';}
  if(type==='image'){L.asset=null;}
  const {props,...rest}=over; Object.assign(L,rest); if(props)Object.assign(L.props,props);
  if(!L.name){const n=project.layers.filter(l=>l.type===type).length+1;L.name=`${NAMES[type]} ${n}`;}
  return L;
}

function evalProp(L,k,t){
  const tr=L.tracks[k];
  if(!tr||!tr.length)return L.props[k];
  if(t<=tr[0].t)return tr[0].v;
  const last=tr[tr.length-1]; if(t>=last.t)return last.v;
  let i=0; while(i<tr.length-2&&tr[i+1].t<=t)i++;
  const a=tr[i],b=tr[i+1]; const p=(EASE[a.ease]||EASE.linear)((t-a.t)/(b.t-a.t));
  return k==='fill'?mixColor(a.v,b.v,p):a.v+(b.v-a.v)*p;
}
function upsertKF(L,k,t,v){
  const tr=L.tracks[k]; let f=tr.find(f=>Math.abs(f.t-t)<eps());
  if(f){f.v=v;}else{const prev=[...tr].reverse().find(f=>f.t<t);f={t:r3(t),v,ease:prev?prev.ease:'outCubic'};tr.push(f);tr.sort((a,b)=>a.t-b.t);}
  return f;
}
function setProp(L,k,v){ if(L.tracks[k])upsertKF(L,k,time,v); else L.props[k]=v; }
function toggleKF(L,k){
  const tr=L.tracks[k];
  if(!tr){L.tracks[k]=[{t:r3(time),v:evalProp(L,k,time),ease:'outCubic'}];selKF={lid:L.id,k,kf:L.tracks[k][0]};return;}
  const i=tr.findIndex(f=>Math.abs(f.t-time)<eps());
  if(i>=0){const [r]=tr.splice(i,1); if(selKF&&selKF.kf===r)selKF=null; if(!tr.length){L.props[k]=r.v;delete L.tracks[k];}}
  else{const f=upsertKF(L,k,time,evalProp(L,k,time));selKF={lid:L.id,k,kf:f};}
}

/* ============================ renderização ============================ */
const cv=$('#cv'), ov=$('#ov'), ctx=cv.getContext('2d'), octx=ov.getContext('2d');
const imgCache={};
function getImage(id){
  if(!id||!assets[id])return null;
  if(!imgCache[id]){const im=new Image();im.onload=()=>draw();im.src=assets[id];imgCache[id]=im;}
  return imgCache[id];
}
function rrect(c,x,y,w,h,r){r=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function shapePath(c,type,w,h,r){
  w=Math.max(0,w);h=Math.max(0,h);c.beginPath();
  if(type==='rect')rrect(c,-w/2,-h/2,w,h,r);
  else if(type==='ellipse')c.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);
  else if(type==='triangle'){c.moveTo(0,-h/2);c.lineTo(w/2,h/2);c.lineTo(-w/2,h/2);c.closePath();}
  else if(type==='star'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?.42:1,px=Math.cos(a)*rr*w/2,py=Math.sin(a)*rr*h/2;i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();}
}
function drawLayer(c,L,t){
  const v=k=>evalProp(L,k,t);
  const op=clamp(v('opacity'),0,1); if(op<=0)return;
  c.save();
  c.translate(v('x'),v('y')); c.rotate(v('rot')*Math.PI/180);
  const s=Math.max(0,v('scale')); c.scale(s,s); c.globalAlpha=op;
  const sw=Math.max(0,v('strokeW'));
  if(L.type==='text'){
    c.font=`${L.weight} ${L.size}px ${L.font}`;c.textBaseline='middle';c.textAlign='left';c.lineJoin='round';
    const lines=String(L.text).split('\n'),lh=L.size*1.18,widths=lines.map(l=>c.measureText(l).width);
    L.props.w=Math.max(20,...widths);L.props.h=Math.max(lh,lines.length*lh);
    let n=Math.round(String(L.text).replace(/\n/g,'').length*clamp(v('reveal'),0,1));
    c.fillStyle=v('fill');c.strokeStyle=L.props.stroke;
    lines.forEach((ln,i)=>{const take=Math.min(ln.length,n);n-=take;const txt=ln.slice(0,take);if(!txt)return;
      const y=(i-(lines.length-1)/2)*lh,x=-widths[i]/2;
      if(sw>0){c.lineWidth=sw;c.strokeText(txt,x,y);} c.fillText(txt,x,y);});
  }else if(L.type==='image'){
    const w=Math.max(0,v('w')),h=Math.max(0,v('h')),img=getImage(L.asset);
    c.beginPath();rrect(c,-w/2,-h/2,w,h,v('radius'));
    if(img&&img.complete&&img.naturalWidth){c.save();c.clip();c.drawImage(img,-w/2,-h/2,w,h);c.restore();}
    else{c.fillStyle='#2a2f3c';c.fill();}
  }else{
    shapePath(c,L.type,v('w'),v('h'),v('radius'));
    if(!L.noFill){c.fillStyle=v('fill');c.fill();}
    if(sw>0){c.lineWidth=sw;c.strokeStyle=L.props.stroke;c.lineJoin='round';c.stroke();}
  }
  c.restore();
}
function renderScene(c,t){
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.fillStyle=project.bg;c.fillRect(0,0,project.w,project.h);
  for(const L of project.layers)if(visibleAt(L,t))drawLayer(c,L,t);
}
function handlesOf(L,t){
  const ev=k=>evalProp(L,k,t),x=ev('x'),y=ev('y'),r=ev('rot')*Math.PI/180,s=ev('scale');
  const hw=ev('w')*s/2,hh=ev('h')*s/2,co=Math.cos(r),si=Math.sin(r);
  const P=(lx,ly)=>({x:x+lx*co-ly*si,y:y+lx*si+ly*co});
  return{c:[P(-hw,-hh),P(hw,-hh),P(hw,hh),P(-hw,hh)],rot:P(0,-hh-32/viewScale),top:P(0,-hh),center:{x,y},r,s};
}
function drawOverlay(){
  octx.clearRect(0,0,ov.width,ov.height);
  const L=sel(); if(!L||exporting||!visibleAt(L,time))return;
  const H=handlesOf(L,time),k=1/viewScale;
  octx.save();octx.lineWidth=1.5*k;octx.strokeStyle='#7c5cff';
  octx.beginPath();H.c.forEach((p,i)=>i?octx.lineTo(p.x,p.y):octx.moveTo(p.x,p.y));octx.closePath();octx.stroke();
  if(!L.locked){
    octx.beginPath();octx.moveTo(H.top.x,H.top.y);octx.lineTo(H.rot.x,H.rot.y);octx.stroke();
    octx.fillStyle='#fff';
    octx.beginPath();octx.arc(H.rot.x,H.rot.y,6*k,0,7);octx.fill();octx.stroke();
    H.c.forEach(p=>{octx.beginPath();octx.rect(p.x-5*k,p.y-5*k,10*k,10*k);octx.fill();octx.stroke();});
  }
  octx.restore();
}
function draw(){ renderScene(ctx,time); drawOverlay(); }

function fitStage(){
  const vp=$('#viewport'),aw=vp.clientWidth-32,ah=vp.clientHeight-32;
  viewScale=Math.max(.05,Math.min(aw/project.w,ah/project.h));
  const f=$('#frame');f.style.width=Math.round(project.w*viewScale)+'px';f.style.height=Math.round(project.h*viewScale)+'px';
}
function applySize(){
  cv.width=ov.width=project.w;cv.height=ov.height=project.h;fitStage();
}
new ResizeObserver(()=>{if(project){fitStage();draw();}}).observe($('#viewport'));

/* ============================ histórico & persistência ============================ */
let hist=[],hi=-1; const LS_KEY='motionlab.project.v1';
function usedAssets(){const o={};project.layers.forEach(l=>{if(l.asset&&assets[l.asset])o[l.asset]=assets[l.asset];});return o;}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify({project,assets:usedAssets()}));}catch(e){}}
function commit(){
  const s=JSON.stringify(project); if(hist[hi]===s)return;
  hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>150)hist.shift();hi=hist.length-1;
  save();updateUndo();
}
function restore(s){
  project=JSON.parse(s); if(!project.layers.some(l=>l.id===selId))selId=null; selKF=null;
  time=clamp(time,0,project.duration); refreshAll();
}
function undo(){if(hi>0){hi--;restore(hist[hi]);save();updateUndo();}}
function redo(){if(hi<hist.length-1){hi++;restore(hist[hi]);save();updateUndo();}}
function updateUndo(){$('#btnUndo').disabled=hi<=0;$('#btnRedo').disabled=hi>=hist.length-1;}
function resetHistory(){hist=[];hi=-1;commit();}

/* ============================ seleção e atualização ============================ */
function select(id){ if(selId===id)return; selId=id;selKF=null;buildInspector();buildTimeline();draw(); }
function refreshAll(){applySize();buildInspector();buildTimeline();setTime(time);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200);}

/* ============================ tempo / playback ============================ */
const fmt=t=>t.toFixed(2)+'s';
function setTime(t,snap=false){
  t=clamp(t,0,project.duration); if(snap)t=Math.round(t*project.fps)/project.fps;
  time=t;
  $('#scrub').value=t/project.duration;
  $('#timeLbl').innerHTML=`<b>${fmt(t)}</b> / ${fmt(project.duration)}`;
  const ph=$('#playhead'); if(ph)ph.style.left=(LABELW+t*pxPerSec)+'px';
  refreshInspector(); draw();
}
function play(){ if(playing)return; if(time>=project.duration-1e-6)time=0; playing=true;lastTs=performance.now();$('#btnPlay').innerHTML=icon('pause');rafId=requestAnimationFrame(tick);}
function pause(){playing=false;cancelAnimationFrame(rafId);$('#btnPlay').innerHTML=icon('play');}
function tick(ts){
  if(!playing)return;
  let t=time+(ts-lastTs)/1000;lastTs=ts;
  if(t>=project.duration){ if(loopOn)t=t%project.duration; else{setTime(project.duration);pause();return;} }
  setTime(t); rafId=requestAnimationFrame(tick);
}

/* ============================ inspetor ============================ */
function propRow(p,L){
  const val=evalProp(L,p.k,time), isC=p.type==='color';
  return `<div class="prow"><span class="plabel" data-scrub="${p.k}" title="Arraste para ajustar">${p.label}</span>
    <input data-k="${p.k}" type="${isC?'color':'number'}" ${isC?'':`step="${p.step}"`} ${p.min!=null?`min="${p.min}"`:''} ${p.max!=null?`max="${p.max}"`:''} value="${isC?val:r2(val)}">
    <button class="kfb" data-kf="${p.k}" title="Adicionar/remover keyframe no playhead">◆</button></div>`;
}
function buildInspector(){
  const el=$('#inspector'),L=sel();
  if(!L){
    const cur=`${project.w}x${project.h}`,known=SIZES.some(s=>`${s[0]}x${s[1]}`===cur);
    el.innerHTML=`<h3>Projeto</h3>
    <div class="prow nokf"><span class="plabel" style="cursor:default">Formato</span><select data-p="size">${SIZES.map(s=>`<option value="${s[0]}x${s[1]}" ${`${s[0]}x${s[1]}`===cur?'selected':''}>${s[2]}</option>`).join('')}${known?'':`<option selected>${cur}</option>`}</select></div>
    <div class="prow nokf"><span class="plabel" style="cursor:default">Fundo</span><input type="color" data-p="bg" value="${project.bg}"></div>
    <div class="prow nokf"><span class="plabel" style="cursor:default">Duração (s)</span><input type="number" data-p="duration" min="1" max="120" step="0.5" value="${project.duration}"></div>
    <div class="prow nokf"><span class="plabel" style="cursor:default">FPS</span><select data-p="fps">${[24,30,60].map(f=>`<option ${f===project.fps?'selected':''}>${f}</option>`).join('')}</select></div>
    <p class="hint">Nenhuma camada selecionada. Clique em um elemento no palco ou na linha do tempo — ou adicione formas e textos no painel à esquerda.</p>
    <p class="hint"><b>Como animar:</b> posicione o playhead, clique no <b style="color:var(--key)">◆</b> ao lado de uma propriedade e mude o valor em outro instante — os keyframes são criados automaticamente. Ou use as animações prontas.</p>`;
    return;
  }
  const isText=L.type==='text',isImg=L.type==='image';
  const T=['x','y',...(isText?[]:['w','h']),'rot','scale','opacity'].map(k=>propRow(PMAP[k],L)).join('');
  let A='';
  if(!isImg)A+=propRow(PMAP.fill,L);
  if(L.type==='rect'||isImg)A+=propRow(PMAP.radius,L);
  if(!isImg)A+=propRow(PMAP.strokeW,L)+`<div class="prow nokf"><span class="plabel" style="cursor:default">Cor contorno</span><input type="color" data-f="stroke" value="${L.props.stroke}"></div>`;
  if(!isText&&!isImg)A+=`<label class="chk"><input type="checkbox" data-f="noFill" ${L.noFill?'checked':''}> Sem preenchimento (só contorno)</label>`;
  let X='';
  if(isText)X=`<h4>Texto</h4><textarea data-f="text">${esc(L.text)}</textarea>
    <div class="prow nokf" style="margin-top:6px"><span class="plabel" style="cursor:default">Fonte</span><select data-f="font">${FONTS.map(f=>`<option value='${f[0]}' ${f[0]===L.font?'selected':''}>${f[1]}</option>`).join('')}</select></div>
    <div class="prow nokf"><span class="plabel" style="cursor:default">Tamanho</span><input type="number" data-f="size" min="8" max="600" value="${L.size}"></div>
    <div class="prow nokf"><span class="plabel" style="cursor:default">Peso</span><select data-f="weight">${[400,600,800,900].map(w=>`<option ${w==L.weight?'selected':''}>${w}</option>`).join('')}</select></div>
    ${propRow(PMAP.reveal,L)}`;
  let K='';
  if(selKF&&selKF.lid===L.id&&(L.tracks[selKF.k]||[]).includes(selKF.kf)){
    K=`<div class="kfsec"><h4>Keyframe · ${PMAP[selKF.k].label}</h4>
      <div class="prow nokf"><span class="plabel" style="cursor:default">Tempo (s)</span><input type="number" step="0.01" min="0" data-kt value="${r2(selKF.kf.t)}"></div>
      <div class="prow nokf"><span class="plabel" style="cursor:default">Easing</span><select data-ke>${Object.keys(EASE).map(e=>`<option value="${e}" ${e===selKF.kf.ease?'selected':''}>${EASE_LABEL[e]}</option>`).join('')}</select></div>
      <p class="hint" style="margin:0 0 6px">O easing controla a curva até o próximo keyframe.</p>
      <button class="btn" data-act="delkf" style="width:100%;justify-content:center">Excluir keyframe</button></div>`;
  }
  el.innerHTML=`<h3>Camada</h3>
    <input type="text" data-f="name" value="${esc(L.name)}">
    <div class="btnrow">
      <button class="ib" data-act="up" title="Trazer para frente">${icon('up')}</button>
      <button class="ib" data-act="down" title="Enviar para trás">${icon('down')}</button>
      <button class="ib" data-act="dup" title="Duplicar (Ctrl+D)">${icon('copy')}</button>
      <button class="ib danger" data-act="del" title="Excluir (Del)">${icon('trash')}</button>
    </div>
    ${K}
    <h4>Transformação</h4>${T}
    <h4>Aparência</h4>${A}${X}
    <h4>Tempo na timeline</h4>
    <div class="prow nokf"><span class="plabel" style="cursor:default">Entra em (s)</span><input type="number" step="0.05" min="0" data-f="start" value="${r2(L.start)}"></div>
    <div class="prow nokf"><span class="plabel" style="cursor:default">Sai em (s)</span><input type="number" step="0.05" min="0" data-f="end" value="${r2(L.end)}"></div>`;
  refreshInspector();
}
function refreshInspector(){
  const L=sel(); if(!L)return;
  $$('#inspector [data-k]').forEach(inp=>{
    if(inp===document.activeElement)return;
    const v=evalProp(L,inp.dataset.k,time); inp.value=inp.type==='color'?v:r2(v);
  });
  $$('#inspector [data-kf]').forEach(b=>{
    const tr=L.tracks[b.dataset.kf];
    b.classList.toggle('has',!!(tr&&tr.length));
    b.classList.toggle('on',!!(tr&&tr.some(f=>Math.abs(f.t-time)<eps())));
  });
}
function afterEdit(rebuildTl=true){ draw(); refreshInspector(); if(rebuildTl)buildTimeline(); }

const ins=$('#inspector');
ins.addEventListener('input',e=>{
  const t=e.target,L=sel();
  if(t.dataset.k&&L){const v=t.type==='color'?t.value:parseFloat(t.value);if(Number.isNaN(v))return;setProp(L,t.dataset.k,v);afterEdit();}
  else if(t.dataset.f&&L){
    const f=t.dataset.f; let v=t.type==='checkbox'?t.checked:t.value;
    if(['size','weight','start','end'].includes(f)){v=parseFloat(v);if(Number.isNaN(v))return;}
    if(f==='stroke')L.props.stroke=v; else L[f]=v;
    if(f==='start'||f==='end'){L.start=clamp(L.start,0,project.duration);L.end=clamp(L.end,L.start+.05,project.duration);}
    draw(); if(f==='name'||f==='start'||f==='end')buildTimeline();
  }
  else if(t.dataset.kt!==undefined&&selKF){const v=parseFloat(t.value);if(!Number.isNaN(v)){selKF.kf.t=r3(clamp(v,0,project.duration));L.tracks[selKF.k].sort((a,b)=>a.t-b.t);draw();buildTimeline();}}
  else if(t.dataset.ke!==undefined&&selKF){selKF.kf.ease=t.value;draw();}
});
ins.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.p){
    const p=t.dataset.p;
    if(p==='bg')project.bg=t.value;
    else if(p==='fps')project.fps=parseInt(t.value);
    else if(p==='duration'){const nd=clamp(parseFloat(t.value)||5,1,120),od=project.duration;
      project.layers.forEach(l=>{l.end=l.end>=od-1e-6?nd:Math.min(l.end,nd);l.start=Math.min(l.start,nd-.1);});project.duration=nd;time=Math.min(time,nd);}
    else if(p==='size'){const[w,h]=t.value.split('x').map(Number);rescaleProject(w,h);}
    commit();refreshAll();return;
  }
  commit(); if(t.dataset.f==='text'||t.dataset.f==='font'||t.dataset.f==='size'||t.dataset.f==='weight')refreshInspector();
});
function rescaleProject(w,h){
  const sx=w/project.w,sy=h/project.h,m=Math.min(sx,sy);
  project.layers.forEach(L=>{
    const sc=(o)=>{o.x*=sx;o.y*=sy;o.w*=m;o.h*=m;o.radius*=m;o.strokeW*=m;};
    sc(L.props);
    for(const k of ['x','y','w','h','radius','strokeW']){(L.tracks[k]||[]).forEach(f=>{f.v*=(k==='x'?sx:k==='y'?sy:m);});}
    if(L.size)L.size=Math.round(L.size*m);
  });
  project.w=w;project.h=h;
}
ins.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return; const L=sel(); if(!L)return;
  if(b.dataset.kf){toggleKF(L,b.dataset.kf);commit();buildInspector();buildTimeline();draw();}
  else if(b.dataset.act)doAct(b.dataset.act);
});
// arrastar o rótulo para ajustar valores (scrub)
ins.addEventListener('pointerdown',e=>{
  const lab=e.target.closest('[data-scrub]'); const L=sel(); if(!lab||!L)return;
  const k=lab.dataset.scrub,p=PMAP[k],x0=e.clientX,v0=evalProp(L,k,time); let moved=false;
  dragWin(e,ev=>{
    moved=true; let v=v0+(ev.clientX-x0)*p.step*(ev.shiftKey?10:1);
    if(p.min!=null)v=Math.max(p.min,v); if(p.max!=null)v=Math.min(p.max,v);
    setProp(L,k,r3(v));afterEdit(false);
  },()=>{if(moved){buildTimeline();commit();}});
});
function doAct(a){
  const L=sel(); if(!L)return; const arr=project.layers,i=arr.indexOf(L);
  if(a==='up'&&i<arr.length-1){[arr[i],arr[i+1]]=[arr[i+1],arr[i]];}
  else if(a==='down'&&i>0){[arr[i],arr[i-1]]=[arr[i-1],arr[i]];}
  else if(a==='dup'){
    const C=JSON.parse(JSON.stringify(L));C.id=uid();C.name=L.name+' cópia';
    C.props.x+=30;C.props.y+=30;(C.tracks.x||[]).forEach(f=>f.v+=30);(C.tracks.y||[]).forEach(f=>f.v+=30);
    arr.splice(i+1,0,C);selId=C.id;selKF=null;
  }
  else if(a==='del'){arr.splice(i,1);selId=null;selKF=null;}
  else if(a==='delkf'&&selKF){const tr=L.tracks[selKF.k],j=tr.indexOf(selKF.kf);if(j>=0)tr.splice(j,1);if(!tr.length){L.props[selKF.k]=selKF.kf.v;delete L.tracks[selKF.k];}selKF=null;}
  commit();buildInspector();buildTimeline();draw();
}

/* ============================ interação no palco ============================ */
function toProject(e){const r=ov.getBoundingClientRect();return{x:(e.clientX-r.left)*project.w/r.width,y:(e.clientY-r.top)*project.h/r.height};}
function dragWin(e,move,up){
  const m=ev=>move(ev);
  const u=ev=>{window.removeEventListener('pointermove',m);window.removeEventListener('pointerup',u);window.removeEventListener('pointercancel',u);up&&up(ev);};
  window.addEventListener('pointermove',m);window.addEventListener('pointerup',u);window.addEventListener('pointercancel',u);
  e.preventDefault();
}
function hitTest(p){
  for(let i=project.layers.length-1;i>=0;i--){
    const L=project.layers[i]; if(L.locked||!visibleAt(L,time))continue;
    const ev=k=>evalProp(L,k,time),s=Math.max(ev('scale'),1e-4),a=-ev('rot')*Math.PI/180;
    const dx=p.x-ev('x'),dy=p.y-ev('y');
    const lx=(dx*Math.cos(a)-dy*Math.sin(a))/s,ly=(dx*Math.sin(a)+dy*Math.cos(a))/s;
    const hw=Math.max(ev('w')/2,6/viewScale),hh=Math.max(ev('h')/2,6/viewScale);
    if(L.type==='ellipse'){if(lx*lx/(hw*hw)+ly*ly/(hh*hh)<=1)return L;}
    else if(Math.abs(lx)<=hw&&Math.abs(ly)<=hh)return L;
  }
  return null;
}
ov.addEventListener('pointerdown',e=>{
  if(exporting)return;
  const p=toProject(e),L=sel();
  if(L&&!L.locked&&visibleAt(L,time)){
    const H=handlesOf(L,time),r=12/viewScale;
    if(Math.hypot(p.x-H.rot.x,p.y-H.rot.y)<r)return startRotate(e,L);
    const ci=H.c.findIndex(q=>Math.hypot(p.x-q.x,p.y-q.y)<r);
    if(ci>=0)return startResize(e,L,ci,H);
  }
  const hit=hitTest(p);
  if(hit){select(hit.id);startMove(e,hit,p);} else select(null);
});
function startMove(e,L,p0){
  const x0=evalProp(L,'x',time),y0=evalProp(L,'y',time);let moved=false;
  dragWin(e,ev=>{
    const p=toProject(ev),dx=p.x-p0.x,dy=p.y-p0.y;
    if(!moved&&Math.hypot(dx,dy)*viewScale<3)return; moved=true;
    let nx=x0+dx,ny=y0+dy; if(ev.shiftKey){if(Math.abs(dx)>Math.abs(dy))ny=y0;else nx=x0;}
    setProp(L,'x',r2(nx));setProp(L,'y',r2(ny));afterEdit(false);
  },()=>{if(moved){buildTimeline();commit();}});
}
function startRotate(e,L){
  const cx=evalProp(L,'x',time),cy=evalProp(L,'y',time);let cur=evalProp(L,'rot',time);
  dragWin(e,ev=>{
    const p=toProject(ev);let raw=Math.atan2(p.y-cy,p.x-cx)*180/Math.PI+90;
    if(ev.shiftKey)raw=Math.round(raw/15)*15;
    cur+=(((raw-cur)%360)+540)%360-180; setProp(L,'rot',r2(cur));afterEdit(false);
  },()=>{buildTimeline();commit();});
}
function startResize(e,L,ci,H){
  const isText=L.type==='text',fixed=H.c[(ci+2)%4],co=Math.cos(H.r),si=Math.sin(H.r),s0=H.s;
  const w0=evalProp(L,'w',time),h0=evalProp(L,'h',time),ratio=w0/Math.max(h0,1e-3);
  const d0=Math.hypot(H.c[ci].x-H.center.x,H.c[ci].y-H.center.y);
  dragWin(e,ev=>{
    const p=toProject(ev);
    if(isText){setProp(L,'scale',r3(Math.max(.02,s0*Math.hypot(p.x-H.center.x,p.y-H.center.y)/d0)));afterEdit(false);return;}
    const dx=p.x-fixed.x,dy=p.y-fixed.y;let du=dx*co+dy*si,dv=-dx*si+dy*co;
    let w=Math.max(4,Math.abs(du)/s0),h=Math.max(4,Math.abs(dv)/s0);
    if(ev.shiftKey){if(w/h>ratio)h=w/ratio;else w=h*ratio;}
    du=Math.sign(du||1)*w*s0;dv=Math.sign(dv||1)*h*s0;
    setProp(L,'w',r2(w));setProp(L,'h',r2(h));
    setProp(L,'x',r2(fixed.x+(du*co-dv*si)/2));setProp(L,'y',r2(fixed.y+(du*si+dv*co)/2));
    afterEdit(false);
  },()=>{buildTimeline();commit();});
}

/* ============================ linha do tempo ============================ */
function buildTimeline(){
  const sc=$('#tlScroll'),sl=sc.scrollLeft,st=sc.scrollTop,pps=pxPerSec,W=Math.ceil(project.duration*pps);
  const steps=[.1,.25,.5,1,2,5,10,30],major=steps.find(s=>s*pps>=70)||60;
  $('#tlScroll').style.setProperty('--grid',(major*pps/5)+'px');
  let h=`<div class="tl-inner" id="tlInner" style="width:${LABELW+W+60}px">`;
  h+=`<div class="tl-row tl-ruler"><div class="tl-label">Camadas</div><div class="tl-track" id="ruler" style="width:${W}px">`;
  for(let t=0;t<=project.duration+1e-6;t+=major)h+=`<span class="tick" style="left:${t*pps}px">${+t.toFixed(2)}s</span>`;
  h+=`</div></div>`;
  for(let i=project.layers.length-1;i>=0;i--){
    const L=project.layers[i],on=L.id===selId;
    const times=new Set();Object.values(L.tracks).forEach(tr=>tr.forEach(f=>times.add(f.t)));
    h+=`<div class="tl-row ${on?'sel':''}" data-lid="${L.id}">
      <div class="tl-label" data-lid="${L.id}">
        <button class="mini ${L.visible?'':'off'}" data-tog="visible" title="Mostrar/ocultar">${icon(L.visible?'eye':'eyeoff',14)}</button>
        <button class="mini ${L.locked?'':'off'}" data-tog="locked" title="Bloquear">${icon(L.locked?'lock':'unlock',14)}</button>
        <span class="nm">${esc(L.name)}</span></div>
      <div class="tl-track" style="width:${W}px" data-scrubtrack>
        <div class="tl-bar ${L.locked?'locked':''} ${L.visible?'':'hidden'}" data-bar="${L.id}" style="left:${L.start*pps}px;width:${Math.max(6,(L.end-L.start)*pps)}px;background:${L.type==='image'||L.type==='text'?'#4b5675':L.props.fill+'b8'}">
          <i class="bh l" data-trim="l"></i><i class="bh r" data-trim="r"></i></div>
        ${[...times].map(t=>`<b class="mk" style="left:${t*pps}px"></b>`).join('')}
      </div></div>`;
    if(on){
      ANIM_ORDER.filter(k=>L.tracks[k]).forEach(k=>{
        h+=`<div class="tl-row sub"><div class="tl-label" data-lid="${L.id}"><span class="nm">↳ ${PMAP[k].label}</span></div>
          <div class="tl-track" style="width:${W}px" data-scrubtrack>${L.tracks[k].map((f,j)=>`<i class="kfd ${selKF&&selKF.kf===f?'sel':''}" data-lid="${L.id}" data-k="${k}" data-i="${j}" style="left:${f.t*pps}px" title="${PMAP[k].label}: ${r2(typeof f.v==='number'?f.v:0)} · ${EASE_LABEL[f.ease]}"></i>`).join('')}</div></div>`;
      });
    }
  }
  h+=`<div id="playhead" style="left:${LABELW+time*pps}px"></div></div>`;
  sc.innerHTML=h; sc.scrollLeft=sl; sc.scrollTop=st;
}
function timeFromX(clientX){
  const r=$('#tlInner').getBoundingClientRect();
  return(clientX-r.left-LABELW)/pxPerSec;
}
$('#tlScroll').addEventListener('pointerdown',e=>{
  const T=e.target;
  const tog=T.closest('[data-tog]');
  if(tog){const L=project.layers.find(l=>l.id===tog.closest('[data-lid]').dataset.lid);L[tog.dataset.tog]=!L[tog.dataset.tog];commit();buildTimeline();draw();e.stopPropagation();return;}
  const kfd=T.closest('.kfd');
  if(kfd){
    const L=project.layers.find(l=>l.id===kfd.dataset.lid),k=kfd.dataset.k,f=L.tracks[k][+kfd.dataset.i];
    selId=L.id;selKF={lid:L.id,k,kf:f};
    $$('.kfd.sel').forEach(x=>x.classList.remove('sel'));kfd.classList.add('sel');
    const x0=e.clientX,t0=f.t;let moved=false;
    buildInspectorKeepScroll();
    dragWin(e,ev=>{
      moved=true;const nt=clamp(t0+(ev.clientX-x0)/pxPerSec,0,project.duration);
      f.t=r3(ev.shiftKey?nt:Math.round(nt*project.fps)/project.fps);kfd.style.left=f.t*pxPerSec+'px';
      L.tracks[k].sort((a,b)=>a.t-b.t);draw();
    },()=>{if(moved)commit();buildTimeline();buildInspector();});
    return;
  }
  const bar=T.closest('.tl-bar');
  if(bar){
    const L=project.layers.find(l=>l.id===bar.dataset.bar);
    if(selId!==L.id){selId=L.id;selKF=null;buildInspector();buildTimeline();}
    if(L.locked)return;
    const mode=T.dataset.trim||'move',x0=e.clientX,s0=L.start,e0=L.end;
    const orig=mode==='move'?JSON.parse(JSON.stringify(L.tracks)):null;let moved=false;
    dragWin(e,ev=>{
      moved=true;let d=(ev.clientX-x0)/pxPerSec; d=Math.round(d*project.fps)/project.fps;
      if(mode==='move'){d=clamp(d,-s0,project.duration-e0);L.start=r3(s0+d);L.end=r3(e0+d);
        for(const k in orig)L.tracks[k].forEach((f,i)=>f.t=r3(orig[k][i].t+d));}
      else if(mode==='l')L.start=r3(clamp(s0+d,0,L.end-.05));
      else L.end=r3(clamp(e0+d,L.start+.05,project.duration));
      draw();
      const b=$(`[data-bar="${L.id}"]`);if(b){b.style.left=L.start*pxPerSec+'px';b.style.width=Math.max(6,(L.end-L.start)*pxPerSec)+'px';}
    },()=>{if(moved){commit();buildTimeline();buildInspector();}});
    return;
  }
  const lab=T.closest('.tl-label[data-lid]');
  if(lab){select(lab.dataset.lid);return;}
  if(T.closest('[data-scrubtrack]')||T.closest('#ruler')){
    if(!T.closest('#ruler')&&!T.closest('.tl-bar'))select(T.closest('[data-lid]')?.dataset.lid||null);
    setTime(timeFromX(e.clientX),true);
    dragWin(e,ev=>setTime(timeFromX(ev.clientX),true));
  }
});

const B=(L,k)=>L.props[k];
function setRange(L,k,list){
  const ts=list.map(a=>a[0]),t0=Math.min(...ts),t1=Math.max(...ts);
  const kept=(L.tracks[k]||[]).filter(f=>f.t<t0-1e-6||f.t>t1+1e-6);
  list.forEach(([t,v,e])=>kept.push({t:r3(t),v,ease:e||'outCubic'}));
  kept.sort((a,b)=>a.t-b.t);L.tracks[k]=kept;
}
function cycle(L,k,t0,t1,step,vals,ease){
  const list=[];let t=t0,i=0;
  while(t<t1-1e-6){list.push([t,vals[i%vals.length],ease]);t+=step;i++;}
  list.push([t1,vals[i%vals.length],'linear']);setRange(L,k,list);
}
const fadeIn=(L,o,d)=>setRange(L,'opacity',[[o.t0,0,'outQuad'],[o.t0+(d||o.d),B(L,'opacity')||1]]);
const fadeOut=(L,o)=>setRange(L,'opacity',[[o.t1-o.d,B(L,'opacity')||1,'inQuad'],[o.t1,0]]);

    [0.3,0.7].forEach((t,i)=>{const r=addL('ellipse','Onda '+(i+1),{x:W/2,y:H*.42,w:300,h:300,fill:'#22d3ee',stroke:'#22d3ee',strokeW:8},{noFill:true});
      K(r,'scale',[[t,.2,'outCubic'],[t+1.4,2.4]]);K(r,'opacity',[[t,1,'linear'],[t+1.4,0]]);});
    let a=addL('star','Estrela',{x:W/2,y:H*.42,w:260,h:260,fill:'#ffc857'});
    K(a,'scale',[[.2,0],[1,1,'outBack']]);K(a,'rot',[[.2,-200],[1,0]]);PRESETS[2].items[0][1](a,{t0:1.2,t1:5,d:.7});
    a=addL('text','Marca',{x:W/2,y:H*.72,fill:'#ffffff'},{text:'ESTRELA',size:110,weight:900});
    K(a,'reveal',[[1,0,'linear'],[1.7,1]]);
    a=addL('text','Slogan',{x:W/2,y:H*.84,fill:'#8d96a9'},{text:'brilhe mais forte',size:36,weight:500});
    K(a,'opacity',[[1.8,0],[2.4,1]]);
  },
  count(){
    project.bg='#12121a';const W=project.w,H=project.h;
    let a=addL('ellipse','Disco',{x:W/2,y:H/2,w:420,h:420,fill:'#7c5cff'});
    cycle(a,'scale',0,5,.5,[1,1.08],'inOutQuad');
    ['3','2','1','GO!'].forEach((txt,i)=>{
      const ring=addL('ellipse','Anel '+txt,{x:W/2,y:H/2,w:420,h:420,stroke:'#22d3ee',strokeW:10},{noFill:true,start:i,end:i+1});
      K(ring,'scale',[[i,1,'outCubic'],[i+1,1.7]]);K(ring,'opacity',[[i,1,'linear'],[i+1,0]]);
      const t=addL('text','Número '+txt,{x:W/2,y:H/2,fill:'#ffffff'},{text:txt,size:txt==='GO!'?190:260,weight:900,start:i,end:i===3?5:i+1});
      K(t,'scale',[[i,1.5],[i+.35,1,'outBack']]);K(t,'opacity',[[i,0],[i+.12,1]]);
    });
  }
};
function loadTemplate(n){
  pause();project=newProject();TEMPLATES[n]();selId=null;selKF=null;time=0;
  applySize();fitTimeline();buildInspector();setTime(0);resetHistory();
}
$('#tplSel').addEventListener('change',e=>{const v=e.target.value;e.target.value='';if(v){loadTemplate(v);toast('Modelo carregado — Ctrl+Z desfaz.');}});

/* ============================ gerador aleatório ============================ */
const PALETTES=[
 ['#0f172a','#7c5cff','#22d3ee','#ffc857','#ff5d73'],['#fff7ed','#ff6b35','#004e89','#1a659e','#f7c59f'],
 ['#111111','#f72585','#7209b7','#3a0ca3','#4cc9f0'],['#0b132b','#1c2541','#3a506b','#5bc0be','#f4f4f9'],
 ['#fefae0','#606c38','#283618','#dda15e','#bc6c25'],['#1a1423','#ff9f1c','#2ec4b6','#e71d36','#fdfffc']
];
const WORDS=['MOTION','FLOW','BOOM','VIBE','CRIA','ENERGIA','DROP','NOVO','BRILHE','PLAY'];
function generate(){
  pause();const pal=pick(PALETTES);
  const keep={w:project.w,h:project.h};
  project=newProject(keep.w,keep.h);project.bg=pal[0];project.duration=6;
  const cols=pal.slice(1),W=project.w,H=project.h,ins=[0,1,2,3,5,6,7,8];
  for(let i=0;i<12;i++){
    const type=pick(['rect','ellipse','triangle','star','ellipse']),sz=rnd(.08,.3)*Math.min(W,H);
    const L=addL(type,`${NAMES[type]} ${i+1}`,{x:rnd(.05,.95)*W,y:rnd(.05,.95)*H,w:sz*(type==='rect'?rnd(.8,1.8):1),h:sz,fill:pick(cols),opacity:+rnd(.6,1).toFixed(2),rot:type==='rect'||type==='triangle'?rnd(-25,25):0,radius:type==='rect'?rnd(0,sz*.3):0});
    const o={d:rnd(.5,.9),t0:i*.1,t1:project.duration};
    PRESETS[0].items[pick(ins)][1](L,o);
    const r=Math.random(); const lo={d:rnd(.6,1.1),t0:o.t0+o.d+.2,t1:project.duration};
    if(r<.3)PRESETS[2].items[0][1](L,lo);else if(r<.55)PRESETS[2].items[1][1](L,lo);else if(r<.7)PRESETS[2].items[3][1](L,lo);else if(r<.85)PRESETS[2].items[2][1](L,lo);
  }
  const tc=luma(pal[0])>.5?'#111111':'#ffffff';
  const bar=addL('rect','Faixa',{x:W/2,y:H/2,w:W*.62,h:H*.26,fill:pal[0],radius:18,opacity:.92});
  K(bar,'scale',[[.9,0],[1.5,1,'outBack']]);
  const t=addL('text','Título',{x:W/2,y:H/2,fill:tc},{text:pick(WORDS),size:Math.round(Math.min(W,H)*.15),weight:900});
  K(t,'reveal',[[1.5,0,'linear'],[2.3,1]]);
  selId=null;selKF=null;time=0;applySize();fitTimeline();buildInspector();setTime(0);resetHistory();play();
}
$('#btnGen').onclick=generate;

/* ============================ arquivos & exportação ============================ */
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
$('#btnSave').onclick=()=>{download(new Blob([JSON.stringify({app:'motionlab',version:1,project,assets:usedAssets()})],{type:'application/json'}),'motion-projeto.json');};
$('#btnOpen').onclick=()=>$('#fileJson').click();
$('#fileJson').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  f.text().then(txt=>{
    try{
      const d=JSON.parse(txt),p=d.project||d;
      if(!p||!Array.isArray(p.layers)||!p.w||!p.h)throw 0;
      pause();project=p;assets=Object.assign(assets,d.assets||{});selId=null;selKF=null;time=0;
      applySize();fitTimeline();buildInspector();setTime(0);resetHistory();toast('Projeto aberto.');
    }catch(err){toast('Arquivo de projeto inválido.');}
  });
});
$('#btnPng').onclick=()=>{const t=time;renderScene(ctx,time);cv.toBlob(b=>download(b,`motion-frame-${t.toFixed(2)}s.png`));};
async function exportVideo(){
  if(!window.MediaRecorder||!cv.captureStream){toast('Seu navegador não suporta exportação de vídeo.');return;}
  pause();
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime){toast('Nenhum codec de vídeo disponível.');return;}
  exporting=true;cancelExport=false;$('#modal').hidden=false;
  const stream=cv.captureStream(project.fps);
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.min(25e6,Math.round(project.w*project.h*project.fps*.15))});
  const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const done=new Promise(r=>rec.onstop=r);
  setTime(0);await sleep(60);rec.start();const t0=performance.now();
  await new Promise(res=>{(function step(){
    const t=(performance.now()-t0)/1000;
    if(cancelExport||t>=project.duration){res();return;}
    setTime(t);$('#pbarI').style.width=(t/project.duration*100)+'%';requestAnimationFrame(step);
  })();});
  setTime(project.duration);await sleep(200);rec.stop();await done;
  stream.getTracks().forEach(t=>t.stop());
  exporting=false;$('#modal').hidden=true;$('#pbarI').style.width='0';draw();
  if(!cancelExport){download(new Blob(chunks,{type:mime}),`motion-${Date.now()}.${mime.includes('mp4')?'mp4':'webm'}`);toast('Vídeo exportado!');}
}
$('#btnExport').onclick=exportVideo;
$('#btnCancelExp').onclick=()=>{cancelExport=true;};

/* ============================ controles & atalhos ============================ */
$('#btnPlay').onclick=()=>playing?pause():play();
$('#btnStart').onclick=()=>setTime(0);
$('#btnLoop').onclick=e=>{loopOn=!loopOn;e.currentTarget.classList.toggle('active',loopOn);};
$('#scrub').addEventListener('input',e=>setTime(parseFloat(e.target.value)*project.duration,true));
$('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b)b.blur();});
document.addEventListener('keydown',e=>{
  const tg=e.target,tag=tg.tagName,typing=tag==='TEXTAREA'||tag==='SELECT'||(tag==='INPUT'&&!['range','checkbox','color'].includes(tg.type));
  const mod=e.ctrlKey||e.metaKey,L=sel();
  if(mod&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo();return;}
  if(typing)return;
  if(e.code==='Space'){e.preventDefault();playing?pause():play();}
  else if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();doAct('dup');}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();if(selKF)doAct('delkf');else doAct('del');}
  else if(e.key==='Escape'){select(null);}
  else if(e.key==='Home'){setTime(0);}
  else if(e.key==='End'){setTime(project.duration);}
  else if(e.key===','){pause();setTime(time-1/project.fps,true);}
  else if(e.key==='.'){pause();setTime(time+1/project.fps,true);}
  else if(e.key.toLowerCase()==='k'&&selKF&&L){toggleKF(L,selKF.k);commit();buildInspector();buildTimeline();draw();}
  else if(e.key.startsWith('Arrow')&&L&&!L.locked){
    e.preventDefault();const st=e.shiftKey?10:1,dx=e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0,dy=e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0;
    if(dx)setProp(L,'x',r2(evalProp(L,'x',time)+dx));if(dy)setProp(L,'y',r2(evalProp(L,'y',time)+dy));
    afterEdit();clearTimeout(document._nt);document._nt=setTimeout(commit,300);
  }
});

/* ============================ inicialização ============================ */
injectIcons();buildPresets();
(function init(){
  let loaded=false;
  try{
    const d=JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(d&&d.project&&Array.isArray(d.project.layers)){project=d.project;assets=d.assets||{};loaded=true;}
  }catch(e){}
  if(loaded){applySize();fitTimeline();buildInspector();setTime(0);resetHistory();}
  else loadTemplate('title');
  $('#btnPlay').innerHTML=icon('play');updateUndo();
  requestAnimationFrame(()=>{fitStage();fitTimeline();draw();});
})();
window.__motionlab={get project(){return project;},get time(){return time;},get playing(){return playing;},setTime,play,pause,addLayer,loadTemplate,generate};
</script>
